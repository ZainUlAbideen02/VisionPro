version: '3.8'

services:
  # FastAPI AI Multimodal Embedding & Vector Search Engine
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: visiontrace-api-prod
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PROJECT_NAME=VisionTrace AI Engine
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - REDIS_URL=redis://redis:6379/0
      - SIGLIP_MODEL_ID=google/siglip2-base-patch16-224
      - ALLOWED_ORIGINS=https://visiontrace.ai,http://localhost:3000
    volumes:
      - api_uploads:/app/data/uploads
      - api_keyframes:/app/data/keyframes
      - api_adapters:/app/static/adapters
    depends_on:
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 4096M
        reservations:
          memory: 1024M
    networks:
      - visiontrace-net

  # Celery Asynchronous Video Keyframe Processing Worker
  worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: visiontrace-worker-prod
    command: celery -A app.core.celery_app worker --loglevel=info -c 2
    restart: always
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - api_uploads:/app/data/uploads
      - api_keyframes:/app/data/keyframes
    depends_on:
      - redis
      - qdrant
    networks:
      - visiontrace-net

  # Qdrant Distributed High-Performance Vector Database
  qdrant:
    image: qdrant/qdrant:v1.9.2
    container_name: visiontrace-qdrant-prod
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6333/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - visiontrace-net

  # Redis In-Memory Task Queue & Caching Broker
  redis:
    image: redis:7-alpine
    container_name: visiontrace-redis-prod
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - visiontrace-net

  # Next.js 14 Frontend Web Application
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: visiontrace-web-prod
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://api:8000
      - NEXT_PUBLIC_WS_URL=ws://api:8000
    depends_on:
      - api
    networks:
      - visiontrace-net

volumes:
  qdrant_storage:
  redis_data:
  api_uploads:
  api_keyframes:
  api_adapters:

networks:
  visiontrace-net:
    driver: bridge
